# نشر Edge Function «gas» (يشغّل كود Apps Script داخل Supabase) — بلا أي أدوات على جهازك.
# الإعداد مرة واحدة من موقع GitHub: Settings ← Secrets and variables ← Actions ← New repository secret
#   SUPABASE_ACCESS_TOKEN : من Supabase ← Account ← Access Tokens ← Generate new token
#   SUPABASE_PROJECT_REF  : المعرّف في رابط المشروع (الجزء قبل .supabase.co)
# التشغيل: تبويب Actions ← «Deploy gas edge function» ← Run workflow (أو تلقائياً عند تغيّر ملفات .gs/الدالة).
name: Deploy gas edge function
on:
  workflow_dispatch:
  push:
    paths: ['*.gs', 'supabase/functions/gas/**', 'tools/build_gas_bundle.mjs', '.github/workflows/deploy-gas.yml']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Build bundle from .gs files
        run: node tools/build_gas_bundle.mjs
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy gas --no-verify-jwt --yes --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
