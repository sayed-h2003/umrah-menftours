<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <!-- 🔍 التكبير بإصبعين مسموح + viewport-fit=cover ليملأ البرنامج شاشات الموبايل ذات النتوء (notch) بأمان.
       هذه الصفحة الحاوية (الغلاف) هي التي تتحكم في تكبير الموبايل لا الإطار الداخلي، فكان user-scalable=no هنا
       يمنع التكبير في كل البرنامج رغم السماح به داخل البرنامج نفسه -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#1e3d59">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="رحلات العمرة">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <!-- 📱 أيقونات مربعة بالمقاسات التي يطلبها الموبايل (أندرويد يرفض الأيقونة غير المربعة فيضع حرفاً افتراضياً بدلها) -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <title>إدارة رحلات العمرة شركة منف للسياحة</title>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; background-color: #1e3d59; overflow: hidden; }
    /* منع سحب-الصفحة-للتحديث والارتداد المطاطي داخل التطبيق المثبّت (standalone) */
    body { overscroll-behavior: none; }
    /* 📱 إطار البرنامج داخل «المساحة الآمنة» للموبايل: لا يختفي شيء خلف نتوء الشاشة أو شريط الإيماءات السفلي.
       لون الحشو = لون رأس البرنامج نفسه (#1e3d59) فيبدو متصلاً دون فواصل */
    #app-wrap { position: fixed; inset: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box; }
    iframe { border: none; width: 100%; height: 100%; display: block; background: #1e3d59; }
    /* 🎬 (V4.319) شاشة التحميل «ج»: توقيع الشركة أولاً (S.H — Smart Software Solutions) ثم شعار البرنامج الجديد
       «إدارة رحلات العمرة والفنادق» مع شريط تحميل. حركة CSS خفيفة (بلا GIF/فيديو) تُعرض مرة واحدة،
       وتختفي الشاشة عند جاهزية البرنامج (بعد 2.8 ثانية على الأقل كي يكتمل التوقيع). */
    #splash { position: fixed; inset: 0; z-index: 10; overflow: hidden; color: #fff; transition: opacity .4s ease;
      background: radial-gradient(110% 70% at 50% 40%, #102c5e 0%, #071a3a 70%);
      font: 500 15px/1.6 'Tajawal', Tahoma, Arial, sans-serif;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash .L1, #splash .L2 { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #splash .L1 { gap: 20px; padding: 0 24px; animation: spIntro 2.6s ease both; pointer-events: none; }
    #splash .L2 { padding: 0 24px calc(26px + env(safe-area-inset-bottom)); animation: spApp .7s ease 2s both; }
    #splash .shB { width: 112px; height: 112px; border-radius: 30px; background: linear-gradient(145deg, #f6dc9c 0%, #dcaa50 55%, #b98330 100%);
      display: flex; align-items: center; justify-content: center; color: #1b1406; font: 800 40px Tahoma, Arial, sans-serif;
      box-shadow: 0 0 60px rgba(243,210,138,.35), 0 18px 40px rgba(0,0,0,.5); animation: spBadge .9s cubic-bezier(.2,.9,.3,1.3) both; }
    #splash .shN { font: 800 25px Tahoma, Arial, sans-serif; direction: ltr; white-space: nowrap; animation: spReveal .8s ease .35s both; }
    #splash .shL { width: 160px; height: 2px; background: linear-gradient(90deg, rgba(243,210,138,0), #f3d28a, rgba(243,210,138,0)); animation: spLine .8s ease .6s both; }
    #splash .shS { font-size: 14px; color: #c9d4ea; animation: spUp .6s ease .95s both; }
    #splash .mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
    #splash .logo { width: 210px; height: 210px; max-width: 58vw; max-height: 58vw; display: block; filter: drop-shadow(0 22px 40px rgba(0,0,0,.55)); }
    #splash .co { color: #f3d28a; font-size: 16px; font-weight: 700; }
    #splash .sp { width: 190px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; position: relative; }
    #splash .sp::after { content: ""; position: absolute; top: 0; bottom: 0; width: 45%; border-radius: 4px;
      background: linear-gradient(90deg, rgba(243,210,138,0), #f3d28a, rgba(243,210,138,0)); animation: spBar 1.5s cubic-bezier(.6,0,.4,1) infinite; }
    #splash #splashMsg { font-size: 13px; color: #c9d4ea; }
    #splash .foot { display: flex; align-items: center; gap: 8px; direction: ltr; font-size: 12.5px; color: #b7c3dc; flex-wrap: wrap; justify-content: center; }
    #splash .foot .mini { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(145deg, #f6dc9c, #c99540); display: flex; align-items: center; justify-content: center; color: #1b1406; font: 800 9px Tahoma, Arial; }
    #splash .foot a { color: #f3d28a; text-decoration: none; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; min-height: 36px; }
    #splash .foot .cr { width: 100%; text-align: center; direction: rtl; font-size: 11px; color: #8fa0c2; }
    #splash .retry { display: none; margin-top: 4px; background: #f3d28a; color: #071a3a; border: none; border-radius: 10px; padding: 10px 22px;
      font: 700 14px Tahoma, Arial, sans-serif; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
    @keyframes spIntro { 0% { opacity: 0 } 8% { opacity: 1 } 72% { opacity: 1 } 100% { opacity: 0; visibility: hidden } }
    @keyframes spApp { from { opacity: 0; transform: scale(.94) } to { opacity: 1; transform: none } }
    @keyframes spBadge { 0% { transform: scale(.3) rotate(-12deg); opacity: 0 } 70% { transform: scale(1.08) rotate(0); opacity: 1 } 100% { transform: scale(1) } }
    @keyframes spReveal { from { clip-path: inset(0 100% 0 0) } to { clip-path: inset(0 0 0 0) } }
    @keyframes spLine { from { transform: scaleX(0) } to { transform: scaleX(1) } }
    @keyframes spUp { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
    @keyframes spBar { 0% { transform: translateX(110%) } 100% { transform: translateX(-110%) } }
    @media (prefers-reduced-motion: reduce) { #splash .L1 { display: none } #splash .L2 { animation: none } #splash .sp::after { animation-duration: 3s } }
    #offline { position: fixed; top: 0; left: 0; right: 0; z-index: 11; display: none; background: #b91c1c; color: #fff; text-align: center;
      font: 700 13px/1.6 Tahoma, Arial, sans-serif; padding: calc(6px + env(safe-area-inset-top)) 8px 6px; gap: 10px; align-items: center; justify-content: center; }
    #offline.show { display: flex; }
    #offline button { background: rgba(255,255,255,.2); color: #fff; border: 1px solid rgba(255,255,255,.5); border-radius: 8px; padding: 3px 12px; font: 700 12px Tahoma; cursor: pointer; }
    @media (prefers-color-scheme: dark) { html, body, iframe { background-color: #10212f; } }
  </style>
</head>
<body>

  <button id="clipFocus" tabindex="-1" aria-hidden="true" style="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;border:0;padding:0;pointer-events:none;"></button>

  <div id="splash">
    <div class="L1" aria-hidden="true">
      <div class="shB">S.H</div>
      <div class="shN">Smart Software Solutions</div>
      <div class="shL"></div>
      <div class="shS">حلول برمجية ذكية</div>
    </div>
    <div class="L2">
      <div class="mid">
        <img class="logo" src="icons/logo-tile-512.png" alt="إدارة رحلات العمرة والفنادق" onerror="this.style.display='none'">
        <div class="co">شركة منف للسياحة</div>
        <div class="sp"></div>
        <div id="splashMsg">جاري تحميل البرنامج…</div>
        <button id="splashRetry" class="retry" onclick="reloadApp()">🔄 إعادة المحاولة</button>
      </div>
      <div class="foot">
        <span class="mini">S.H</span><span>Smart Software Solutions</span><span style="color:#5d6f93;">•</span>
        <a href="https://wa.me/201002864926" target="_blank" rel="noopener"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#25d366" d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.26-.46-2.39-1.47-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.07c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.7.63.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.69.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35M12.05 21.78a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.89-9.88 2.64 0 5.12 1.03 6.99 2.9a9.83 9.83 0 0 1 2.89 6.99c0 5.45-4.44 9.88-9.89 9.88m8.41-18.3A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.68 1.45h.01c6.55 0 11.89-5.34 11.89-11.89 0-3.18-1.24-6.17-3.48-8.41"/></svg>01002864926</a>
        <span class="cr">© جميع الحقوق محفوظة</span>
      </div>
    </div>
  </div>

  <div id="offline">⚠️ لا يوجد اتصال بالإنترنت <button onclick="reloadApp()">🔄 إعادة التحميل</button></div>

  <div id="app-wrap">
    <iframe id="app" title="إدارة رحلات العمرة" src="https://script.google.com/macros/s/AKfycbzmZ7ubyNlqjum0SlNSDqmIAN1VqDNd9FU-eM6Ihqg17-MAb_QnV7cDKCGaVJ_6-2iA7g/exec"
            allow="clipboard-write; clipboard-read; web-share"></iframe>
  </div>

  <script>
    var APP_SRC = document.getElementById('app').src;
    function reloadApp() {
      var fr = document.getElementById('app'), sp = document.getElementById('splash');
      document.getElementById('splashMsg').textContent = 'جاري تحميل البرنامج…';
      document.getElementById('splashRetry').style.display = 'none';
      document.querySelector('#splash .sp').style.display = '';
      sp.classList.remove('hide'); sp.style.display = 'flex';
      try { fr.src = 'about:blank'; } catch (e) {}
      setTimeout(function () { fr.src = APP_SRC; armLoadWatch(); }, 60);
    }

    var _loadTimer = null;
    function armLoadWatch() {
      clearTimeout(_loadTimer);
      _loadTimer = setTimeout(function () {   // لم يُحمَّل الإطار خلال ٢٥ ثانية ⇒ اعرض زر إعادة المحاولة بدل الانتظار الأبدي
        var sp = document.getElementById('splash');
        if (!sp || sp.classList.contains('hide')) return;
        document.getElementById('splashMsg').textContent = 'تأخّر التحميل — تحقّق من الاتصال';
        document.querySelector('#splash .sp').style.display = 'none';
        document.getElementById('splashRetry').style.display = '';
      }, 25000);
    }

    (function () {
      var sp = document.getElementById('splash'), fr = document.getElementById('app');
      var t0 = Date.now();   // (V4.319) يبقى التوقيع ظاهراً 2.8 ثانية على الأقل حتى لو حُمِّل البرنامج أسرع
      var hide = function () { clearTimeout(_loadTimer); setTimeout(function () { sp.classList.add('hide'); setTimeout(function () { sp.style.display = 'none'; }, 450); }, Math.max(0, t0 + 2800 - Date.now())); };
      fr.addEventListener('load', function () { if (fr.src !== 'about:blank') hide(); });
      armLoadWatch();
      var off = document.getElementById('offline');
      var upd = function () { off.classList.toggle('show', !navigator.onLine); };
      window.addEventListener('online', function () { upd(); if (document.getElementById('splash').classList.contains('hide')) return; reloadApp(); });
      window.addEventListener('offline', upd); upd();
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker Registered'))
          .catch(err => console.log('Service Worker Failed', err));
      });
    }

    /* 🖼️ جسر الصور: البرنامج يعمل داخل إطار جوجل (iframe) الذي لا يملك صلاحية الحافظة ولا المشاركة.
       هذه الصفحة هي النافذة الرئيسية فتملكهما — يرسل البرنامج الصورة إلى هنا لتنسخها/تشاركها مباشرة
       (ضغطة المستخدم داخل البرنامج تُحتسب لهذه الصفحة أيضاً)، ثم ترد بالنتيجة. تقبل الرسائل فقط من
       نطاقات جوجل التي يعمل عليها البرنامج. */
    window.addEventListener('message', function (ev) {
      var d = ev.data;
      if (!d || typeof d !== 'object' || d.type !== 'mf-img-action') return;
      var host = '', nullOrigin = (ev.origin === 'null');
      if (!nullOrigin) {
        try { host = new URL(ev.origin).hostname; } catch (e) { return; }
        if (!/(^|\.)googleusercontent\.com$/.test(host) && !/(^|\.)script\.google\.com$/.test(host)) return;
      }
      var reply = function (ok, err) {
        try { ev.source.postMessage({ type: 'mf-img-action-result', id: d.id, ok: ok, err: err || '' }, nullOrigin ? '*' : ev.origin); } catch (e) {}
      };
      var fail = function (e) { reply(false, (e && e.name === 'AbortError') ? 'abort' : String((e && (e.name + ': ' + e.message)) || e)); };
      try {
        if (d.action === 'ping') { reply(true); return; }
        if (d.action === 'copy') {
          if (!(navigator.clipboard && navigator.clipboard.write && window.ClipboardItem)) { reply(false, 'unsupported'); return; }
          // المتصفح يشترط أن تكون هذه الصفحة هي المُركَّز عليها لحظة النسخ — ننقل التركيز إليها لحظياً ثم نعيده للبرنامج
          var fb = document.getElementById('clipFocus');
          try { window.focus(); fb.focus(); } catch (e) {}
          var back = function () { try { document.querySelector('iframe').focus(); } catch (e) {} };
          navigator.clipboard.write([new ClipboardItem({ 'image/png': d.blob })])
            .then(function () { back(); reply(true); }).catch(function (e) { back(); fail(e); });
          return;
        }
        if (d.action === 'share') {
          var files = (d.files || []).map(function (f) { return new File([f.blob], f.name, { type: 'image/png' }); });
          if (!(navigator.canShare && navigator.canShare({ files: files }))) { reply(false, 'unsupported'); return; }
          navigator.share({ files: files, title: 'مشاركة' }).then(function () { reply(true); }).catch(fail);
          return;
        }
      } catch (e) { fail(e); }
    });

    /* 📱 (V4.319) حفظ «مفتاح الجهاز» هنا أيضاً: تخزين إطار جوجل الداخلي معزول وقد يُمسح (خصوصاً آيفون)، أما هذه
       الصفحة فتخزينها ثابت — فيستعيد البرنامج جلسته بصمت عند فتحه من الشاشة الرئيسية بدل طلب إعادة الدخول.
       نفس فحص النطاقات أعلاه، والرد للإطار المرسِل فقط. */
    window.addEventListener('message', function (ev) {
      var d = ev.data;
      if (!d || typeof d !== 'object' || d.type !== 'mf-auth') return;
      var host = '';
      try { host = new URL(ev.origin).hostname; } catch (e) { return; }
      if (!/(^|\.)googleusercontent\.com$/.test(host) && !/(^|\.)script\.google\.com$/.test(host)) return;
      // لا يُسلَّم المفتاح إلا لإطار البرنامج نفسه (أو إطار داخله) — لا لأي نافذة أخرى على نطاقات جوجل
      var inApp = false, fr = document.getElementById('app');
      try { for (var wv = ev.source, n = 0; wv && n < 6; n++) { if (fr && wv === fr.contentWindow) { inApp = true; break; } if (wv === wv.parent) break; wv = wv.parent; } } catch (e) {}
      if (!inApp) return;
      var K = 'mfDevKey', v = '';
      try {
        if (d.action === 'set' && d.key) localStorage.setItem(K, String(d.key));
        else if (d.action === 'clear') localStorage.removeItem(K);
        else if (d.action === 'get') v = localStorage.getItem(K) || '';
      } catch (e) {}
      if (d.action === 'get') { try { ev.source.postMessage({ type: 'mf-auth-result', id: d.id, key: v }, ev.origin); } catch (e) {} }
    });
  </script>
