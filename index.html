<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1e3d59">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.ico">
  <link rel="apple-touch-icon" href="%D9%84%D9%88%D8%AC%D9%88%20%D8%A7%D8%B4%D8%B9%D8%A7%D8%B1%D8%A7%D8%AA%20%D8%B1%D8%AD%D9%84%D8%A7%D8%AA%20%D8%A7%D9%84%D8%B9%D9%85%D8%B1%D8%A9.png">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <title>إدارة رحلات العمرة شركة منف للسياحة</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #1e3d59; }
    iframe { border: none; width: 100%; height: 100%; }
    /* شاشة تحميل أثناء فتح البرنامج بدل مساحة فارغة — تختفي تلقائياً عند جاهزية الإطار */
    #splash { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: #1e3d59; color: #fff; font: 700 15px/1.6 Tahoma, Arial, sans-serif; transition: opacity .35s ease; }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash .sp { width: 42px; height: 42px; border-radius: 50%; border: 4px solid rgba(255,255,255,.25); border-top-color: #fff; animation: r 0.9s linear infinite; }
    #splash small { font-weight: 400; opacity: .75; font-size: 12px; }
    @keyframes r { to { transform: rotate(360deg); } }
    #offline { position: fixed; top: 0; left: 0; right: 0; z-index: 11; display: none; background: #b91c1c; color: #fff; text-align: center;
      font: 700 13px/1.6 Tahoma, Arial, sans-serif; padding: 6px; }
  </style>
</head>
<body>

  <button id="clipFocus" tabindex="-1" aria-hidden="true" style="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;border:0;padding:0;pointer-events:none;"></button>
  <div id="splash"><div class="sp"></div><div>جاري تحميل البرنامج…</div><small>شركة منف للسياحة</small></div>
  <div id="offline">⚠️ لا يوجد اتصال بالإنترنت — سيتم المتابعة تلقائياً عند عودة الاتصال</div>
  <iframe id="app" title="إدارة رحلات العمرة" src="https://script.google.com/macros/s/AKfycbzmZ7ubyNlqjum0SlNSDqmIAN1VqDNd9FU-eM6Ihqg17-MAb_QnV7cDKCGaVJ_6-2iA7g/exec"
          allow="clipboard-write; clipboard-read; web-share"></iframe>

  <script>
    (function () {
      var sp = document.getElementById('splash'), fr = document.getElementById('app');
      var hide = function () { sp.classList.add('hide'); setTimeout(function () { sp.style.display = 'none'; }, 400); };
      fr.addEventListener('load', hide);
      setTimeout(hide, 25000);   // احتياط: لا تبقى شاشة التحميل ظاهرة أبداً
      var off = document.getElementById('offline');
      var upd = function () { off.style.display = navigator.onLine ? 'none' : 'block'; };
      window.addEventListener('online', upd); window.addEventListener('offline', upd); upd();
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker Registered'))
          .catch(err => console.log('Service Worker Failed', err));
      });
    }

    /* 🖼️ جسر الصور: البرنامج يعمل داخل إطار جوجل (iframe) الذي لا يملك صلاحية الحافظة ولا المشاركة.
       هذه الصفحة هي النافذة الرئيسية فتملكهما — يرسل البرنامج الصورة إلى هنا لتنسخها/تشاركها مباشرة
       (ضغطة المستخدم داخل البرنامج تُحتسب لهذه الصفحة أيضاً)، ثم ترد بالنتيجة. تقبل الرسائل فقط من
       نطاقات جوجل التي يعمل عليها البرنامج. */
    window.addEventListener('message', function (ev) {
      var d = ev.data;
      if (!d || typeof d !== 'object' || d.type !== 'mf-img-action') return;
      var host = '', nullOrigin = (ev.origin === 'null');
      if (!nullOrigin) {
        try { host = new URL(ev.origin).hostname; } catch (e) { return; }
        if (!/(^|\.)googleusercontent\.com$/.test(host) && !/(^|\.)script\.google\.com$/.test(host)) return;
      }
      var reply = function (ok, err) {
        try { ev.source.postMessage({ type: 'mf-img-action-result', id: d.id, ok: ok, err: err || '' }, nullOrigin ? '*' : ev.origin); } catch (e) {}
      };
      var fail = function (e) { reply(false, (e && e.name === 'AbortError') ? 'abort' : String((e && (e.name + ': ' + e.message)) || e)); };
      try {
        if (d.action === 'ping') { reply(true); return; }
        if (d.action === 'copy') {
          if (!(navigator.clipboard && navigator.clipboard.write && window.ClipboardItem)) { reply(false, 'unsupported'); return; }
          // المتصفح يشترط أن تكون هذه الصفحة هي المُركَّز عليها لحظة النسخ — ننقل التركيز إليها لحظياً ثم نعيده للبرنامج
          var fb = document.getElementById('clipFocus');
          try { window.focus(); fb.focus(); } catch (e) {}
          var back = function () { try { document.querySelector('iframe').focus(); } catch (e) {} };
          navigator.clipboard.write([new ClipboardItem({ 'image/png': d.blob })])
            .then(function () { back(); reply(true); }).catch(function (e) { back(); fail(e); });
          return;
        }
        if (d.action === 'share') {
          var files = (d.files || []).map(function (f) { return new File([f.blob], f.name, { type: 'image/png' }); });
          if (!(navigator.canShare && navigator.canShare({ files: files }))) { reply(false, 'unsupported'); return; }
          navigator.share({ files: files, title: 'مشاركة' }).then(function () { reply(true); }).catch(fail);
          return;
        }
      } catch (e) { fail(e); }
    });
  </script>
</body>
</html>
